<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <meta name="description" content=""/>
        <meta name="author" content=""/>
        <title>Prediction</title>
        <link rel="stylesheet" href="https://use.typekit.net/wxu5gpv.css">
        <!-- Bootstrap core CSS -->
        <link href="bootstrap_theme/bootstrap.css" rel="stylesheet" type="text/css">
        <!-- Custom styles for this template -->
        <link href="style.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://use.typekit.net/umt8wej.css">
        <script>
        /* Pinegrow Interactions, do not remove */ (function(){try{if(!document.documentElement.hasAttribute('data-pg-ia-disabled')) { window.pgia_small_mq=typeof pgia_small_mq=='string'?pgia_small_mq:'(max-width:767px)';window.pgia_large_mq=typeof pgia_large_mq=='string'?pgia_large_mq:'(min-width:768px)';var style = document.createElement('style');var pgcss='html:not(.pg-ia-no-preview) [data-pg-ia-hide=""] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show=""] {opacity:1;visibility:visible;display:block;}';if(document.documentElement.hasAttribute('data-pg-id') && document.documentElement.hasAttribute('data-pg-mobile')) {pgia_small_mq='(min-width:0)';pgia_large_mq='(min-width:99999px)'} pgcss+='@media ' + pgia_small_mq + '{ html:not(.pg-ia-no-preview) [data-pg-ia-hide="mobile"] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show="mobile"] {opacity:1;visibility:visible;display:block;}}';pgcss+='@media ' + pgia_large_mq + '{html:not(.pg-ia-no-preview) [data-pg-ia-hide="desktop"] {opacity:0;visibility:hidden;}html:not(.pg-ia-no-preview) [data-pg-ia-show="desktop"] {opacity:1;visibility:visible;display:block;}}';style.innerHTML=pgcss;document.querySelector('head').appendChild(style);}}catch(e){console&&console.log(e);}})()
    </script>
    </head>
    <body class="background">
        <section class="hero">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 col-md-12">
                        <img src="assets/desktop-header.png" id="desktop" class="w-100"/>
                        <img src="assets/mobile-header.png" id="mobile" class="w-100"/>
                    </div>
                </div>
            </div>
        </section>
        <section class="body-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10 ">
                        <h1>PREDICT THE MATCH SCORE</h1>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
                <div class="row mb-5">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10">
                        <div class="container py-3">
                            <!-- Logos + VS -->
                            <div class="row align-items-center text-center mb-2">
                                <div class="col-5">
                                    <img src="assets/pirates.png" alt="pirates" class="img-fluid team-logo">
                                    <h4>Orlando Pirates</h4>
                                </div>
                                <div class="col-2"><span class="vs-text">VS</span>
                                </div>
                                <div class="col-5">
                                    <img src="assets/golden-arrows.png" alt="Golden Arrows" class="img-fluid team-logo">
                                    <h4>Golden Arrows</h4>
                                </div>
                            </div>
                            <!-- Scores -->
                            <div class="row align-items-center mt-4">
                                <div class="form-fill-out col-5 col-md-5">
                                    <input pattern="[0-9]+" title="score" class="input-date" type="tel" id="op-score" name="op-score" value="" size="8" maxlength="2" placeholder="score"/>
                                </div>
                                <div class="col-2 col-md-2 d-flex align-items-center justify-content-center">
                                    <span class="score-divider"></span>
                                </div>
                                <div class="form-fill-out col-5 col-md-5">
                                    <input pattern="[0-9]+" title="score" class="input-date" type="tel" id="arrows-score" name="arrows-score" value="" size="8" maxlength="2" placeholder="score"/>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-4" data-bs-toggle="modal"
                                data-bs-target="#predictionSuccessModal">submit prediction</button>
                        </div>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>
        </section>
        <section class="footer">
            <div class="container-fluid footer-area">
                <div class="row">
                    <div class="col col-md col-xl">
</div>
                    <div class="col-10 col-md-9 col-xl-9">
                        <!-- <img src="assets/sab-ara-line.svg" alt="sab-ara-line" class="w-100"/> -->
                        <img src="assets/distell-ara-line.svg" alt="distell-ara-line" class="w-100"/>
                    </div>
                    <div class="col col-md col-xl">
</div>
                </div>
            </div>
        </section>
        <!-- Prediction success modal -->
        <div
            class="modal fade"
            id="predictionSuccessModal"
            tabindex="-1"
            aria-labelledby="predictionSuccessModalLabel"
            aria-describedby="predictionSuccessMessage"
            aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="predictionSuccessModalLabel">
                            PREDICTION SUCCESSFUL
                        </h4>

                        <button
                            type="button"
                            class="btn-close btn-close-white prediction-modal-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="predictionSuccessMessage">
                            <strong>Prediction locked in.</strong> Good luck Buccaneer!
                        </p>

                        <p>
                            Spin the wheel for a chance to WIN AN<br>
                            AMSTEL JERSEY.
                        </p>

                        <div class="row justify-content-center">
                            <div class="col-12 col-sm-11">
                                <!-- Replace with your actual spin wheel page -->
                                <a href="spin-wheel.html" class="btn btn-primary spin-wheel-btn">
                                    SPIN THE WHEEL
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Bootstrap core JavaScript
    ================================================== -->
        <!-- Placed at the end of the document so the pages load faster -->
        <script src="assets/js/popper.min.js"></script>
        <script src="bootstrap/js/bootstrap.min.js"></script>
        <script src="pgia/lib/pgia.js"></script>
    </body>
</html>
