    <body class="background">
        <section class="hero">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 col-md-12">
                        <img src="assets/desktop-header.png" id="desktop" class="w-100"/>
                        <img src="assets/mobile-header.png" id="mobile" class="w-100"/>
                    </div>
                </div>
            </div>
        </section>
        <section class="body-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10 ">
                        <h1>Predict the match score & stand a chance to win an amstel SHIRT</h1>
                        <h3>Fill in the form to enter</h3>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-5 col-md-5 col-sm-10">
                        <form role="form">
                            <div class="mb-1">
                                <label for="firstName">First name*</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" aria-describedby="firstName" placeholder="first name" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="LastName">Last name*</label>
                                <input type="text" class="form-control" id="LastName" name="LastName" aria-describedby="LastName" placeholder="last name" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="cellNumber">Cell number*</label>
                                <input type="tel" class="form-control" id="cellNumber" name="cellNumber" placeholder="e.g 0841234567" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="EmailAddress">Email address</label>
                                <input type="email" class="form-control" id="EmailAddress" name="EmailAddress" placeholder="example@domain.com"/>
                            </div>
                            <div class="mb-1">
                                <label for="storeSelect">Province*</label>
                                <select id="province" name="ProvinceSelect" class="form-control" required="">
                                    <option value="" hidden="">
                                        select
</option>
                                    <option value="Eastern Cape">
                                        Eastern Cape
</option>
                                    <option value="Free State">
                                        Free State
</option>
                                    <option value="Gauteng">
                                        Gauteng
</option>
                                    <option value="KwaZulu-Natal">
                                        KwaZulu-Natal
</option>
                                    <option value="Limpopo">
                                        Limpopo
</option>
                                    <option value="Mpumalanga">
                                        Mpumalanga
</option>
                                    <option value="Northern Cape">
                                        Northern Cape
</option>
                                    <option value="North West">
                                        North West
</option>
                                    <option value="Western Cape">
                                        Western Cape
</option>
                                </select>
                            </div>
                            <div class="mb-1">
                                <label for="size">Shirt size*</label>
                                <select id="size" name="size" class="form-control" required="">
                                    <option value="" hidden="">select</option>
                                    <option value="Small">Small</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Large">Large</option>
                                </select>
                            </div>
                            <!-- <div class="mb-3">
                                <label for="fileUpload">
                                    Upload your proof of purchase*
</label><br>
                                <input type="file" class="" id="fileUpload"/>
                            </div> -->
                            <div class="form-check mb-1 pt-2">
                                <input type="checkbox" class="form-check-input" id="optIn"/>
                                <label class="form-check-label pb-0 ps-2 pt-2" for="optIn">Opt in for communications</label>
                            </div>
                            <div class="form-check mb-1">
                                <input type="checkbox" class="form-check-input" id="termsAndConditions"/>
                                <label class="form-check-label pb-0 ps-2 pt-0" for="termsAndConditions">I accept the <a href="#"> Terms and Conditions*</a>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>

</div>
